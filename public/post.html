<script>
    if (!(sessionStorage.EMAIL_USUARIO)) {
        window.location = "login.html";
    } else {
        let params = new URLSearchParams(window.location.search);
        let idPost = params.get("id");

        fetch(`posts/buscarPorId/${idPost}`)
            .then(function (res) {
                return res.json();
            })
            .then(function (post) {
                postNome.innerHTML = post.nome;
            });
    };
</script>
