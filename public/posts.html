<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/posts.css">
    <script src="js/pesquisa.js"></script>
    <title>O Restaurante</title>
</head>

<body>
    <header>
        <div class="border-head">
            <div class="header">
                <div class="l-side">
                    <a href="index-logado.html"><img src="img/placeholder.png" alt="logo" class="imagem-he"></a>
                </div>
                <div class="mid">
                    <input type="text" id="search" onkeydown="pesquisar(event)">
                </div>
                <div class="r-side">
                    <div id="nome_usuario">
                        <a href="config.html" class="usuario-nome">Usuario</a>
                    </div>
                    <div id="imagem_usuario">
                        <a href="config.html"><img src="img/placeholder.png" alt="" class="img_usuario"></a>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main>
        <div>
            <div id="postes" class="posts">
            </div>
            <div class="ver-mais">
                <span onclick="carregarMais()">Carregar Mais</span>
            </div>
        </div>
    </main>
    <footer>
        <div class="footer">
            <div>

            </div>
        </div>
    </footer>
</body>

</html>

<script>
    if (!(sessionStorage.EMAIL_USUARIO)) {
        window.location = "login.html";
    } else {
        let carregados = 0
        let maximo = false

        console.log(`comecei o script`)

        nome_usuario.innerHTML = `<a href="config.html" class="usuario-nome">${sessionStorage.NOME_USUARIO}</a>`

        imagem_usuario.innerHTML = `<a href="config.html"><img src="img/pfp/${sessionStorage.PFP}" alt="" onerror="this.onerror=null; this.src='img/placeholder.png';" class="img_usuario"></a>`

        console.log(sessionStorage.PESQUISANDO)
        if (sessionStorage.PESQUISANDO == 'false') {
            console.log(`entrei no caso de não tem`)
            fetch("posts/renderizar")
                .then(function (resposta) {
                    return resposta.json();
                })
                .then(function (posts) {
                    for (let i = 0; i < posts.length; i++) {
                        let post = posts[i];
                        postes.innerHTML += `
                        <a href="javascript:void(0)" onclick="avisar(${post.idPost})" class="tira-coiso">
                            <div class="post tira-coiso">
                                <div class="img-post tira-coiso">
                                    <img src="img/posts/${post.imagem}" alt="" onerror="this.src='img/placeholder.png'">
                                </div>
                                <div class="txt-post tira-coiso">
                                    <span>${post.nome}</span> | 
                                    <span>${post.userr}</span>
                                </div>
                            </div>
                        </a>
                        `;
                    }

                    carregados += posts.length

                    if (posts.length < 18) {
                        maximo = true
                    }
                });
        } else if (sessionStorage.PESQUISANDO == 'true') {
            console.log(`entrei no caso de tem`)
            let pesq = sessionStorage.PESQUISA_ATUAL

            fetch(`posts/renderizarPorPesquisa/${pesq}`)
                .then(function (resposta) {
                    return resposta.json()
                })
                .then(function (posts) {
                    for (let i = 0; i < posts.length; i++) {
                        let post = posts[i];
                        postes.innerHTML += `
                        <a href="javascript:void(0)" onclick="avisar(${post.idPost})" class="tira-coiso">
                            <div class="post tira-coiso">
                                <div class="img-post tira-coiso">
                                    <img src="img/posts/${post.imagem}" alt="" onerror="this.src='img/placeholder.png'">
                                </div>
                                <div class="txt-post tira-coiso">
                                    <span>${post.nome}</span>
                                    <span>${post.userr}</span>
                                </div>
                            </div>
                        </a>
                        `;
                    }
                })

            delete sessionStorage.PESQUISA_ATUAL
            sessionStorage.PESQUISANDO = 'false'

            carregados += posts.length

            if (posts.length < 18) {
                maximo = true
            }
        }

        function avisar(id) {
            sessionStorage.ID_POST = id

            window.location = "post.html";
        }

        function pesquisar(evento) {
            if (evento.key == "Enter") {
                sessionStorage.PESQUISA_ATUAL = search.value
                sessionStorage.PESQUISANDO = 'true'
                window.location = "posts.html"
            }
        }


        function carregarMais() {
            if (maximo == false) {
                fetch("posts/carregarMais", {
                    method: 'POST',
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        carregadosServer: carregados
                    })
                }).then(
                    function (resposta) {
                        return resposta.json()
                    }
                ).then(
                    function (posts) {
                        for (let i = 0; i < posts.length; i++) {
                            let post = posts[i];
                            postes.innerHTML += `
                            <a href="javascript:void(0)" onclick="avisar(${post.idPost})" class="tira-coiso">
                                <div class="post tira-coiso">
                                    <div class="img-post tira-coiso">
                                        <img src="img/posts/${post.imagem}" alt="" onerror="this.src='img/placeholder.png'">
                                    </div>
                                    <div class="txt-post tira-coiso">
                                        <span>${post.nome}</span>
                                        <span>${post.userr}</span>
                                    </div>
                                </div>
                            </a>
                            `;
                        }

                        carregados += posts.length

                        if (posts.length < 18) {
                            maximo = true
                        }
                    }
                )
            }
        }
    }
</script>
