<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/posts.css">
    <title>O Restaurante</title>
</head>

<body>
    <header>
        <div class="border-head">
            <div class="header">
                <div class="l-side">
                    <a href="index-logado.html"><img src="img/placeholder.png" alt="logo" class="imagem-he"></a>
                </div>
                <div class="mid">
                    <input type="text" id="search">
                </div>
                <div class="r-side">
                    <div id="nome_usuario">
                        <a href="configuracao.html" class="usuario-nome">Usuario</a>
                    </div>
                    <div id="imagem_usuario">
                        <a href="configuracao.html"><img src="img/placeholder.png" alt="" class="pfp-index"></a>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main>
        <div>
            <div id="postes" class="posts">
            </div>
            <div class="ver-mais">
                <span onclick="carregarMais()">Ver Mais >></span>
            </div>
        </div>
    </main>
    <footer>
        <div class="footer">
            <div>

            </div>
        </div>
    </footer>
</body>

</html>

<script>
    if (!(sessionStorage.EMAIL_USUARIO)) {
        window.location = "login.html";
    } else {
        renderiza()
    }

    nome_usuario.innerHTML = `<a href="configuracao.html" class="usuario-nome">${sessionStorage.NOME_USUARIO}</a>`

    imagem_usuario.innerHTML = `<a href="configuracao.html"><img src="img/${sessionStorage.ID_USUARIO}.png" alt="" onerror="this.onerror=null; this.src='img/placeholder.png';" class="img_usuario"></a>`

    function renderiza() {
        fetch("posts/renderizar")
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (posts) {
                for (let i = 0; i < posts.length; i++) {
                    let post = posts[i];
                    document.getElementById("postes").innerHTML += `
                        <a href="post.html">
                            <div class="post">
                                <div class="img-post">
                                    <img src="img/${post.idPost}.png" alt="" onerror="this.src='img/placeholder.png'">
                                </div>
                                <div class="txt-post">
                                    <span>${post.nome}</span>
                                    <span>${post.userr}</span>
                                </div>
                            </div>
                        </a>
            `;
                }
            });
    }
</script>
