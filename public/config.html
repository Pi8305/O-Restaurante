    <input type="text" id="tagsUsuario">
    <button onclick="enviarPost()">enviar</button>

<script>
    function enviar() {
        let usuarioAtual = sessionStorage.ID_USUARIO
        const formData = new FormData();
        formData.append('foto', arquivo.files[0])
        formData.append('id', usuarioAtual)

        fetch("arquivos/postArquivo", {
            method: "POST",
            body: formData
        })
            .then(function (resposta) {
                console.log("status:", resposta.status);
                console.log("Salvou a pfp")
            })
    }

    function enviarPost() {
        tags = tagsUsuario.value.split(',')

        fetch('arquivos/verificarTags'), {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({

            }).then(function (resposta) {

</script>
