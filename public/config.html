<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/config.css">
    <link rel="stylesheet" href="css/posts.css">
    <script src="js/sessao.js"></script>
    <title>Usuario</title>
</head>

<body>
    <header>
        <div class="border-head">
            <div class="header">
                <div class="l-side">
                    <a href="index-logado.html"><img src="img/placeholder.png" alt="logo" class="imagem-he"></a>
                </div>
                <div class="mid">
                    <input type="text" id="search" onkeydown="pesquisar(event)">
                </div>
                <div class="r-side-logado">
                    <div id="nome_usuario">
                        <a href="config.html" class="usuario-nome">Usuario</a>
                    </div>
                    <div id="imagem_usuario">
                        <a href="config.html"><img src="img/placeholder.png" alt="" class="img_usuario"></a>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <div class="borda-main">
        <main>
            <div id="divUsuario" class="div-usuario">
                <div class="pfp-info">
                    <div id="divImg" class="div-imagem">
                        <img src="img/placeholder.png" alt="">
                    </div>
                </div>
                <div class="div-info-usuario">
                    <div id="divNome" class="div-nome">
                        <span>none</span>
                    </div>
                    <div id="divPronomes" class="div-pronomes">
                        <span>none</span>
                    </div>
                    <div id="divIdade" class="div-info-outros">
                        <span>none</span>
                    </div>
                    <div id="divDesc" class="div-info-outros">
                        <span>none</span>
                    </div>
                </div>
                <div id="divLinks" class="div-info-links">

                </div>
            </div>
            <div class="div-arquivo">
                <input type="file" id="arquivo" class="inp-arquivo">
                <button onclick="enviar()">Enviar</button>
            </div>
            <div class="titulo">
                <span>Alterar informações</span>
                <span>Novo post</span>
            </div>
            <div class="enviaveis">
                <div class="div_info">
                    <div class="div-extras">
                        <span>Alterar bio</span>
                        <div>
                            <input type="text" id="inpDesc" placeholder="descrição">
                            <input type="number" id="inpIdade" placeholder="idade">
                            <input type="text" id="inpPronomes" placeholder="pronomes">
                        </div>
                        <button onclick="salvarExtras()">Salvar</button>
                    </div>
                    <div class="div-links">
                        <span>Alterar links</span>
                        <div class="div-inp-links">
                            <div>
                                <input type="text" id="div_linktree" placeholder="linktree">
                                <input type="text" id="div_instagram" placeholder="instagram">
                                <input type="text" id="div_twitter" placeholder="twitter">
                                <input type="text" id="div_bluesky" placeholder="bluesky">
                            </div>
                            <div>
                                <input type="text" id="div_youtube" placeholder="youtube">
                                <input type="text" id="div_discord" placeholder="discord">
                                <input type="text" id="div_outros1" placeholder="outro link">
                                <input type="text" id="div_outros2" placeholder="outro link">
                            </div>
                        </div>
                        <button onclick="salvarLinks()">Salvar</button>
                    </div>
                </div>
                <div class="borda">
                    <div class="div-post">
                        <input type="file" id="arquivoPost">
                        <input type="text" id="nomePost">
                        <input type="text" id="descricaoPost">
                        <input type="text" id="tagsUsuario"><button onclick="AddTag()">Adicionar tag</button>
                        <div id="tagsss" class="tagsss"></div>
                        <button onclick="enviarPost()">enviar</button>
                    </div>
                </div>
            </div>
    </div>
    <div class="div-titulo-posts">
        <span>Posts</span>
    </div>
    <div id="postes" class="posts posts-add">

    </div>
    </main>
    <footer>
        <div class="footer">
            <div>

            </div>
        </div>
    </footer>
</body>

</html>

<script>
    if (!(sessionStorage.EMAIL_USUARIO)) {
        window.location = "login.html";
    }

    sessionStorage.PESQUISANDO = false

    delete sessionStorage.PESQUISA_ATUAL

    nome_usuario.innerHTML = `<a href="config.html" class="usuario-nome">${sessionStorage.NOME_USUARIO}</a>`

    imagem_usuario.innerHTML = `<a href="config.html"><img src="img/pfp/${sessionStorage.PFP}" alt="" onerror="this.onerror=null; this.src='img/placeholder.png';" class="img_usuario"></a>`

    divNome.innerHTML = `<span>${sessionStorage.NOME_USUARIO}</span>`

    divImg.innerHTML = `<img src="img/pfp/${sessionStorage.PFP}" alt="" onerror="this.onerror=null; this.src='img/placeholder.png';">`

    if (sessionStorage.PRONOMES_USUARIO == 'nada') {
        divPronomes.innerHTML = ''
    } else {
        divPronomes.innerHTML = `<span>${sessionStorage.PRONOMES_USUARIO}</span>`
    }

    if (sessionStorage.DESC_USUARIO == 'nada') {
        divDesc.innerHTML = ''
    } else {
        divDesc.innerHTML = `<span>${sessionStorage.DESC_USUARIO}</span>`
    }

    if (sessionStorage.IDADE_USUARIO == 'nada') {
        divIdade.innerHTML = ''
    } else {
        divIdade.innerHTML = `<span>${sessionStorage.IDADE_USUARIO}</span>`
    }

    let coisos = ['LINK_USUARIO', 'INSTA_USUARIO', 'TWT_USUARIO', 'BSKY_USUARIO', 'YT_USUARIO', 'DISC_USUARIO', 'OUTROS1_USUARIO', 'OUTROS2_USUARIO']

    let foi = false
    for (i = 0; i < coisos.length; i++) {
        let coiso = coisos[i]
        if (sessionStorage[coiso] != 'nada') {
            if (foi == false) {
                divLinks.innerHTML += `<span class="titulo mais-espaco">Links:</span><br>`
            }
            foi = true

            let linkAtual = sessionStorage[coiso]

            if (linkAtual.length > 19) {
                linkAtual = linkAtual.slice(0, 17)
                linkAtual += '...'
            }

            divLinks.innerHTML += `<a href="${sessionStorage[coiso]}">${linkAtual}</a><br>`
        }
    }

    renderiza()

    function renderiza() {
        fetch(`posts/renderizarPorUsuario/`, {
            method: 'POST',
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                idUsuarioServer: sessionStorage.ID_USUARIO
            })
        })
            .then(function (resposta) {
                return resposta.json()
            })
            .then(function (posts) {
                for (let i = 0; i < posts.length; i++) {
                    let post = posts[i];
                    postes.innerHTML += `
                            <a href="javascript:void(0)" onclick="avisar(${post.idPost})" class="tira-coiso">
                                <div class="post tira-coiso">
                                    <div class="img-post tira-coiso">
                                        <img src="img/posts/${post.imagem}" alt="" onerror="this.src='img/placeholder.png'">
                                    </div>
                                    <div class="txt-post tira-coiso">
                                        <span>${post.nome}</span>
                                        <span>${post.userr}</span>
                                    </div>
                                </div>
                            </a>
                            `;
                }
            })
    }

    function avisar(id) {
        sessionStorage.ID_POST = id

        window.location = "post.html";
    }

    function pesquisar(evento) {
        if (evento.key == "Enter") {
            sessionStorage.PESQUISA_ATUAL = search.value
            sessionStorage.PESQUISANDO = 'true'
            window.location = "posts.html"
        }
    }

    let tagues = []
    let taguesADD = []

    function enviar() {
        let usuarioAtual = sessionStorage.ID_USUARIO
        const formData = new FormData();
        formData.append('foto', arquivo.files[0])
        formData.append('id', usuarioAtual)

        fetch("arquivos/postArquivo", {
            method: "POST",
            body: formData
        })
            .then(function (resposta) {
                console.log("status:", resposta.status);
                console.log("Salvou a pfp")
                setTimeout(() => limparSessao(), 500)
            })
    }

    function AddTag() {
        let tague = tagsUsuario.value

        if (tague == '') {
            return false;
        }

        fetch(`posts/checkTags`)
            .then(function (resposta) {
                return resposta.json();
            })
            .then(function (resposta) {
                let existe = false;

                for (let i = 0; i < resposta.length; i++) {
                    if (resposta[i].tag == tague) {
                        existe = true;
                        break
                    }
                }

                tagues.push(tague);
                if (!existe) {
                    taguesADD.push(tague);
                }
            })
            .then(function () {
                tagsss.innerHTML += `${tague} `
            });
    }

    function enviarPost() {

        if (tagues == []) {
            return false;
        }

        let usuarioAtual = sessionStorage.ID_USUARIO
        const formData = new FormData()
        formData.append('foto', arquivoPost.files[0])
        formData.append('id', usuarioAtual)
        let nome = nomePost.value
        let desc = descricaoPost.value

        let taguesF = `${tagues}`
        let taguesADDF = `${taguesADD}`

        if (!(taguesADD.length == 0)) {
            console.log(`entrou aqui`)
            fetch("posts/salvarTags", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    tagServerAdd: taguesADDF
                })
            }).then(function (resposta) {
                console.log("Salvou as tags")
            })
        }

        fetch("posts/salvarPost", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nomePostServer: nome,
                descPostServer: desc,
                idUsuario: usuarioAtual
            })
        }).then(function (res) {
            console.log("Salvou o post")
        }).then(function () {
            return fetch("posts/adicionarTags", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    tagsPostServer: taguesF,
                    idUsuario: usuarioAtual
                })
            })
        }).then(function (resposta) {
            console.log("Adicionou tags")
        }).then(function () {
            return fetch("arquivos/salvarImagemPost", {
                method: "POST",
                body: formData
            })
        }).then(function () {
            console.log("Salvou a img do post")
        }).then(function () {
            window.location = "posts.html"
        })

        tagues = []
        taguesADD = []
    }

    function salvarExtras() {
        let desc = inpDesc.value
        let idade = inpIdade.value
        let pronomes = inpPronomes.value

        if (desc == '' && sessionStorage.DESC_USUARIO == 'nada') {
            desc = "nada"
        } else if (desc == '' && sessionStorage.DESC_USUARIO != 'nada') {
            desc = sessionStorage.DESC_USUARIO
        }
        if (idade == '' && sessionStorage.IDADE_USUARIO == 0) {
            idade = 0
        } else if (idade == '' && sessionStorage.IDADE_USUARIO != 0) {
            idade = sessionStorage.IDADE_USUARIO
        }
        if (pronomes == '' && sessionStorage.PRONOMES_USUARIO == 'nada') {
            pronomes = 'nada'
        } else if (pronomes == '' && sessionStorage.PRONOMES_USUARIO != 'nada') {
            pronomes = sessionStorage.PRONOMES_USUARIO
        }

        let mandar = `${desc},${idade},${pronomes}`

        fetch("usuarios/extras", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                extrasServer: mandar,
                idUsuarioServer: sessionStorage.ID_USUARIO
            })
        }).then(function (resultado) {
            limparSessao()
        })
    }

    function salvarLinks() {
        let linktree = div_linktree.value
        let instagram = div_instagram.value
        let twitter = div_twitter.value
        let bluesky = div_bluesky.value
        let youtube = div_youtube.value
        let discord = div_discord.value
        let outros1 = div_outros1.value
        let outros2 = div_outros2.value

        if (linktree == '' && sessionStorage.LINK_USUARIO == 'nada') {
            linktree = 'nada'
        } else if (linktree == '' && sessionStorage.LINK_USUARIO != 'nada') {
            linktree = sessionStorage.LINK_USUARIO
        }
        if (instagram == '' && sessionStorage.INSTA_USUARIO == 'nada') {
            instagram = 'nada'
        } else if (instagram == '' && sessionStorage.INSTA_USUARIO != 'nada') {
            instagram = sessionStorage.INSTA_USUARIO
        }
        if (twitter == '' && sessionStorage.TWT_USUARIO == 'nada') {
            twitter = 'nada'
        } else if (twitter == '' && sessionStorage.TWT_USUARIO != 'nada') {
            twitter = sessionStorage.TWT_USUARIO
        }
        if (bluesky == '' && sessionStorage.BSKY_USUARIO == 'nada') {
            bluesky = 'nada'
        } else if (bluesky == '' && sessionStorage.BSKY_USUARIO != 'nada') {
            bluesky = sessionStorage.BSKY_USUARIO
        }
        if (youtube == '' && sessionStorage.YT_USUARIO == 'nada') {
            youtube = 'nada'
        } else if (youtube == '' && sessionStorage.YT_USUARIO != 'nada') {
            youtube = sessionStorage.YT_USUARIO
        }
        if (discord == '' && sessionStorage.DISC_USUARIO == 'nada') {
            discord = 'nada'
        } else if (discord == '' && sessionStorage.DISC_USUARIO != 'nada') {
            discord = sessionStorage.DISC_USUARIO
        }
        if (outros1 == '' && sessionStorage.OUTROS1_USUARIO == 'nada') {
            outros1 = 'nada'
        } else if (outros1 == '' && sessionStorage.OUTROS1_USUARIO != 'nada') {
            outros1 = sessionStorage.OUTROS1_USUARIO
        }
        if (outros2 == '' && sessionStorage.OUTROS2_USUARIO == 'nada') {
            outros2 = 'nada'
        } else if (outros2 == '' && sessionStorage.OUTROS2_USUARIO != 'nada') {
            outros2 = sessionStorage.OUTROS2_USUARIO
        }

        let mandar = `${linktree},${instagram},${twitter},${bluesky},${youtube},${discord},${outros1},${outros2}`

        fetch("usuarios/links", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                linksServer: mandar,
                idUsuarioServer: sessionStorage.ID_USUARIO
            })
        }).then(function (resposta) {
            limparSessao()
        })
    }

    function pesquisar(evento) {
            if (evento.key == "Enter") {
                sessionStorage.PESQUISA_ATUAL = search.value
                sessionStorage.PESQUISANDO = 'true'
                window.location = "posts.html"
            }
        }
</script>
