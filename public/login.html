<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/login.css">
    <title>Login</title>
</head>

<body>
    <header>
        <div class="border-head">
            <div class="header">
                <div class="l-side">
                    <a href="index.html"><img src="img/placeholder.png" alt="logo" class="imagem-he"></a>
                </div>
                <div class="mid">
                    <input type="text" id="search">
                </div>
                <div class="r-side">
                    <img src="img/imagem2.png" alt="">
                    <div class="register-button">
                        <a href="">Registrar</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <body>
        <div class="login-main">
            <div class="alerta_erro">
                <div class="card_erro" id="cardErro">
                    <span id="mensagem_erro"></span>
                </div>
            </div>
            <div class="borda">
                <div class="elementos">
                    <div>
                        Insira seus dados para realizar o login
                    </div>
                    <div>
                        <input type="text" id="inp_email" class="tamanho">
                    </div>
                    <div>
                        <input type="text" id="inp_senha" class="tamanho">
                    </div>
                    <div>
                        <button onclick="entrar()" class="tamanho-botao">Entrar</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</body>

</html>

<script>


    function entrar() {
        aguardar();

        var emailVar = inp_email.value;
        var senhaVar = inp_senha.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "Os campos precisam ser preenchidos para realizar o log-in";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
