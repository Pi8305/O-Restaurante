<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/login.css">
  <title>Login</title>
</head>

<body>
  <header>
    <div class="border-head">
      <div class="header">
        <div class="l-side">
          <a href="index.html"><img src="img/logo_site.png" alt="logo" class="imagem-he"></a>
        </div>
        <div class="mid">
          <input type="text" id="search" onkeydown="pesquisar(event)" placeholder="pesquisar tag">
        </div>
        <div class="r-side">
          <div class="login-button apagar">
            <span>Login</span>
          </div>
          <div class="register-button">
            <a href="cadastro.html">Registrar</a>
          </div>
        </div>
      </div>
    </div>
    </div>
  </header>

  <main>
    <div class="login-main">
      <div class="borda">
        <div class="elementos">
          <div class="alerta_erro-login">
            <div class="card_erro-login" id="cardErro">
              <span id="mensagem_erro"></span>
            </div>
          </div>
          <div>
            Insira os dados para o login
          </div>
          <div>
            <label for="inp_email" class="mover">Email:</label>
            <input type="text" id="inp_email" class="tamanho mover" placeholder="aaaa@bbbb.ccc">
          </div>
          <div class="confirmar-senha">
            <div>
              <label for="inp_senha" class="mover">Senha:</label>
              <input type="password" id="inp_senha" class="tamanho mover" placeholder="********">
            </div>
          </div>
          <div>
            <div id="botao"><button onclick="entrar()" class="tamanho-botao">Entrar</button></div>
          </div>
          <div>
            <a href="cadastro.html">Ou faça o cadastro aqui!</a>
          </div>
        </div>
      </div>
  </main>
  <footer>
    <div class="footer">
      <div>

      </div>
    </div>
  </footer>
</body>

</html>

<script>
  function entrar() {

    var emailVar = inp_email.value;
    var senhaVar = inp_senha.value;

    if (emailVar == "" || senhaVar == "") {
      cardErro.innerHTML = `<span>Os campos precisam ser preenchidos para realizar o login</span>`
      return false;
    } else {

      console.log("FORM LOGIN: ", emailVar);
      console.log("FORM SENHA: ", senhaVar);

      fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          emailServer: emailVar,
          senhaServer: senhaVar
        })
      }).then(function (resposta) {
        console.log("ESTOU NO THEN DO entrar()!")

        if (resposta.ok) {
          console.log(resposta);

          if (resposta == []) {

          } else {

            resposta.json().then(json => {
              console.log(json);
              console.log(JSON.stringify(json));
              sessionStorage.EMAIL_USUARIO = json.email;
              sessionStorage.NOME_USUARIO = json.nome;
              sessionStorage.ID_USUARIO = json.idUsuario;
              sessionStorage.DESC_USUARIO = json.descricao;
              sessionStorage.DT_USUARIO = json.dtCriacao;
              sessionStorage.IDADE_USUARIO = json.idade;
              sessionStorage.PRONOMES_USUARIO = json.pronomes;
              sessionStorage.PFP = json.pfp;
              sessionStorage.LINK_USUARIO = json.linktree;
              sessionStorage.INSTA_USUARIO = json.instagram;
              sessionStorage.TWT_USUARIO = json.twitter;
              sessionStorage.BSKY_USUARIO = json.bluesky;
              sessionStorage.YT_USUARIO = json.youtube;
              sessionStorage.DISC_USUARIO = json.discord;
              sessionStorage.OUTROS1_USUARIO = json.outros1;
              sessionStorage.OUTROS2_USUARIO = json.outros2;

              window.location = "./index-logado.html";
            });
          }
        } else {
          cardErro.innerHTML = `<span>Senha e/ou email incorreto(s)</span>`
          console.log("Houve um erro ao tentar realizar o login!");

          resposta.text().then(texto => {
            console.error(texto);
          });
        }

      }).catch(function (erro) {
        console.log(erro);
      })

      return false;
    }
  }

  function pesquisar(evento) {
    if (evento.key == "Enter") {
      window.location.reload()
    }
  }
</script>
