<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/sessao.js"></script>
    <title>Login</title>
</head>

<body>
    <header>
        <div class="border-head">
            <div class="header">
                <div class="l-side">
                    <a href="index.html"><img src="img/placeholder.png" alt="logo" class="imagem-he"></a>
                </div>
                <div class="mid">
                    <input type="text" id="search">
                </div>
                <div class="r-side">
                    <img src="img/imagem2.png" alt="" style="padding-right: 0.22px;">
                    <div class="register-button">
                        <a href="">Registrar</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="login-main">
            <div class="alerta_erro">
                <div class="card_erro" id="cardErro">
                    <span id="mensagem_erro"></span>
                </div>
            </div>
            <div class="borda">
                <div class="elementos">
                    <div>
                        Insira seus dados para realizar o login
                    </div>
                    <div>
                        <label for="inp_email">Email:</label>
                        <input type="text" id="inp_email" class="tamanho">
                    </div>
                    <div>
                        <label for="inp_email">Senha:</label>
                        <input type="text" id="inp_senha" class="tamanho">
                    </div>
                    <div>
                        <button onclick="entrar()" class="tamanho-botao">Entrar</button>
                    </div>
                    <div>
                        <a href="cadastro.html">Ou registre-se aqui</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>

<script>


    function entrar() {
        /* aguardar(); */

        var emailVar = inp_email.value;
        var senhaVar = inp_senha.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "<span style='color: red;'>Os campos precisam ser preenchidos para realizar o log-in</span>";
            /* finalizarAguardar(); */
            return false;
        }
        else {
            /* setInterval(sumirMensagem, 5000) */
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.idUsario;
                    sessionStorage.DESC_USUARIO = json.descricao;
                    sessionStorage.DT_USUARIO = json.dtCriacao;
                    sessionStorage.IDADE_USUARIO = json.idade;
                    sessionStorage.PRONOMES_USUARIO = json.pronomes;
                    sessionStorage.LINK_USUARIO = json.linktree;
                    sessionStorage.INSTA_USUARIO = json.instagram;
                    sessionStorage.TWT_USUARIO = json.twitter;
                    sessionStorage.BSKY_USUARIO = json.bluesky;
                    sessionStorage.YT_USUARIO = json.youtube;
                    sessionStorage.DISC_USUARIO = json.discord;
                    sessionStorage.OUTROS1_USUARIO = json.outros1;
                    sessionStorage.OUTROS2_USUARIO = json.outros2;

                    window.location = "./index-logado.html";
                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    /* finalizarAguardar(texto); */
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    /* function sumirMensagem() {
        cardErro.style.display = "none"
    } */

</script>
