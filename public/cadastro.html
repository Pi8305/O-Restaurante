<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="js/sessao.js"></script>
  <title>Cadastro</title>
</head>

<body>
  <header>
    <div class="border-head">
      <div class="header">
        <div class="l-side">
          <a href="index.html"><img src="img/logo_site.png" alt="logo" class="imagem-he"></a>
        </div>
        <div class="mid">
          <input type="text" id="search" onkeydown="pesquisar(event)" placeholder="pesquisar tag">
        </div>
        <div class="r-side">
          <div class="login-button">
            <a href="login.html">Login</a>
          </div>
          <div class="register-button apagar">
            <span>Registrar</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="login-main">
      <div class="borda">
        <div class="elementos">
          <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
              <span id="mensagem_erro"></span>
            </div>
          </div>
          <div>
            Insira os dados para o cadastro
          </div>
          <div>
            <label for="inp_nome" class="mover">Nome:</label>
            <input type="text" id="inp_nome" class="tamanho mover" placeholder="NÃO INSIRA SEU NOME REAL">
          </div>
          <div>
            <label for="inp_email" class="mover">Email:</label>
            <input type="text" id="inp_email" class="tamanho mover" placeholder="aaaa@bbbb.ccc">
          </div>
          <div class="confirmar-senha">
            <div>
              <label for="inp_senha" class="mover">Senha:</label>
              <input type="password" id="inp_senha" class="tamanho mover" placeholder="********">
            </div>
            <div>
              <label for="inp_c_senha" class="c-senha">Senha:</label>
              <input type="password" id="inp_c_senha" class="tamanho" placeholder="Confirme a senha">
            </div>
            <div>
              <span class="senha-info mover">(precisa conter 1 simbulo e 1 letra maiuscula e
                minuscula)</span>
            </div>
          </div>
          <div>
            <div id="botao"><button onclick="cadastrar()" class="tamanho-botao">Cadastrar</button></div>
          </div>
          <div>
            <a href="login.html">Ja tem uma conta? Realize o login aqui</a>
          </div>
        </div>
      </div>
  </main>
  <footer>
    <div class="footer">
      <div>

      </div>
    </div>
  </footer>
</body>

</html>

<script>
  function aguarde() {
    botao.innerHTML = `<span>Aguarde...</span>`
  }
  function terminou() {
    botao.innerHTML = `<button onclick="cadastrar()" class="tamanho-botao">Cadastrar</button>`
  }

  function cadastrar() {
    aguarde()
    var nomeVar = inp_nome.value;
    var emailVar = inp_email.value;
    var senhaVar = inp_senha.value;
    var CSenhaVar = inp_c_senha.value;
    let simbulos = ['@', '!', '#', '#', '$', '%', '^', '&', '*', '(', ')', '[', ']', '{', '}', '-', '_', '=', '+', '/', '?', '.', '>', '<', ',', ';', ':', '|', '`', '~', ``, `"`]
    let senhaValida = false

    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      CSenhaVar == ""
    ) {
      mensagem_erro.innerHTML =
        `<span id="mensagem_erro">Insira todos os valores</span>`
      terminou()
      return false;
    };

    if (!emailVar.includes('@') || !emailVar.includes('.') || emailVar.includes('@.')) {
      mensagem_erro.innerHTML = "Email invalido"
      terminou()
      return false;
    };

    if (senhaVar.length < 8) {
      mensagem_erro.innerHTML = "Senha curta demais"
      terminou()
      return false;
    }

    for (i = 0; i < simbulos.length; i++) {
      if (senhaVar.includes(simbulos[i])) {
        senhaValida = true;
        break;
      };
    };

    if (!senhaValida) {
      mensagem_erro.innerHTML = "Senha invalida, insira uma senha mais forte"
      terminou()
      return false;
    };

    if (senhaVar != CSenhaVar) {
      mensagem_erro.innerHTML =
        "Senhas diferentes"
      terminou()
      return false;
    };



    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          window.location = "login.html";
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });

    terminou()
    return false;
  }

  function pesquisar(evento) {
    if (evento.key == "Enter") {
      window.location = "login.html"
    }
  }
</script>
