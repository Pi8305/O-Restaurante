<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="js/sessao.js"></script>
  <title>Login</title>
</head>

<body>
  <header>
    <div class="border-head">
      <div class="header">
        <div class="l-side">
          <a href="index.html"><img src="img/placeholder.png" alt="logo" class="imagem-he"></a>
        </div>
        <div class="mid">
          <input type="text" id="search">
        </div>
        <div class="r-side">
          <img src="img/imagem2.png" alt="" style="padding-right: 0.22px;">
          <div class="register-button">
            <a href="">Registrar</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="login-main">
      <div class="alerta_erro">
        <div class="card_erro" id="cardErro">
          <span id="mensagem_erro"></span>
        </div>
      </div>
      <div class="borda">
        <div class="elementos">
          <div>
            Insira os dados para o cadastro
          </div>
          <div>
            <label for="inp_email">Nome:</label>
            <input type="text" id="inp_nome" class="tamanho" placeholder="NÃO INSIRA SEU NOME REAL">
          </div>
          <div>
            <label for="inp_email">Email:</label>
            <input type="text" id="inp_email" class="tamanho" placeholder="aaaa@bbbb.ccc">
          </div>
          <div>
            <label for="inp_email">Senha: <span class="senha">(precisa conter 1 simbulo e 1 letra maiuscula e
                minuscula)</span></label>
            <input type="text" id="inp_senha" class="tamanho" placeholder="********">
          </div>
          <div>
            <label for="inp_email">Confirmar senha:</label>
            <input type="text" id="inp_c_senha" class="tamanho" placeholder="********">
          </div>
          <div>
            <div id="botao"><button onclick="cadastrar()" class="tamanho-botao">Cadastrar</button></div>
          </div>
          <div>
            <a href="cadastro.html">Ja tem uma conta? Realize o login aqui</a>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>

</html>

<script>
  function aguarde() {
    botao.innerHTML = `<span>Aguarde...</span>`
  }
  function terminou() {
    botao.innerHTML = `<button onclick="cadastrar()" class="tamanho-botao">Entrar</button>`
  }

  function cadastrar() {
    aguarde()
    var nomeVar = inp_nome.value;
    var emailVar = inp_email.value;
    var senhaVar = inp_senha.value;
    var CSenhaVar = inp_c_senha.value;
    let simbulos = ['@', '!', '#', '#', '$', '%', '^', '&', '*', '(', ')', '[', ']', '{', '}', '-', '_', '=', '+', '/', '?', '.', '>', '<', ',', ';', ':', '|', '`', '~', `'`, `"`]
    let senhaValida = false

    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      CSenhaVar == ""
    ) {
      mensagem_erro.innerHTML =
        "Insira todos os valores"
      terminou()
      return false;
    };

    if (!emailVar.includes('@') || !emailVar.includes('.') || emailVar.includes('@.')) {
      mensagem_erro.innerHTML = "Email invalido"
      terminou()
      return false;
    };

    for (i = 0; i < simbulos.length; i++) {
      if (senhaVar.includes(simbulos[i])) {
        senhaValida = true;
        break;
      };
    };

    if (!senhaValida) {
      mensagem_erro.innerHTML = "Senha invalida, insira uma senha mais forte"
      terminou()
      return false;
    };

    if (senhaVar != CSenhaVar) {
      mensagem_erro.innerHTML =
        "Senhas diferentes"
      terminou()
      return false;
    };



    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          window.location = "login.html";
          limparFormulario();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
      
      terminou()
    return false;
  }
</script>
